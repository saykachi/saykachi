<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="saykachi profile card">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .lbl  { fill: #6e6e6e; font-size: 13px; letter-spacing: 2px; }
    .val  { fill: #f2f2f2; font-size: 15px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .row { opacity: 0; animation: fadeIn .6s ease-out forwards; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: .4s; } .r3 { animation-delay: .6s; }
    .r4 { animation-delay: .8s; } .r5 { animation-delay: 1s; } .r6 { animation-delay: 1.2s; }
    .cursor { animation: blink 1s steps(1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="819" height="259" rx="4" fill="#000000" stroke="#262626"/>

  <g class="mono">
    <g class="row r1">
      <text x="40" y="56" fill="#f2f2f2" font-size="26" font-weight="700" letter-spacing="1">saykachi</text>
      <text x="780" y="56" text-anchor="end" class="lbl">FULL-STACK DEVELOPER</text>
      <line x1="40" y1="78" x2="780" y2="78" stroke="#262626"/>
    </g>

    <g class="row r2">
      <text x="40" y="116" class="lbl">FOCUS</text>
      <text x="160" y="116" class="val">cross-platform apps &amp; web services</text>
    </g>
    <g class="row r3">
      <text x="40" y="146" class="lbl">STACK</text>
      <text x="160" y="146" class="val">TypeScript · React · Vue · Next.js · Node.js · Rust · Tauri</text>
    </g>
    <g class="row r4">
      <text x="40" y="176" class="lbl">VALUES</text>
      <text x="160" y="176" class="val">clean architecture · performance · security</text>
    </g>
    <g class="row r5">
      <text x="40" y="206" class="lbl">STATUS</text>
      <circle cx="166" cy="201" r="4" fill="#f2f2f2"/>
      <text x="180" y="206" class="val">open to collaboration</text>
    </g>

    <g class="row r6">
      <text x="780" y="232" text-anchor="end" fill="#6e6e6e" font-size="13">~/saykachi $ <tspan fill="#f2f2f2" class="cursor">▍</tspan></text>
    </g>
  </g>
</svg>
