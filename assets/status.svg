<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-label="saykachi status window">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .jp   { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif; }
    .lbl  { fill: #8a8a8a; font-size: 13px; letter-spacing: 1px; }
    .val  { fill: #f5f5f5; font-size: 15px; font-weight: 700; }
    .red  { fill: #ff2e4d; }
    .dim  { fill: #5a5a5a; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scan   { from { transform: translateY(-40px); } to { transform: translateY(420px); } }
    @keyframes pulse  { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes glitch {
      0%, 92%, 100% { transform: translate(0, 0); }
      93% { transform: translate(-3px, 1px); }
      95% { transform: translate(3px, -1px); }
      97% { transform: translate(-1px, 0); }
    }

    .row  { opacity: 0; animation: fadeIn .5s ease-out forwards; }
    .r1 { animation-delay: .3s; } .r2 { animation-delay: .5s; } .r3 { animation-delay: .7s; }
    .r4 { animation-delay: .9s; } .r5 { animation-delay: 1.1s; } .r6 { animation-delay: 1.3s; }
    .r7 { animation-delay: 1.5s; }

    .bar  { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    .b1 { animation-delay: 1.0s; } .b2 { animation-delay: 1.2s; } .b3 { animation-delay: 1.4s; }
    .b4 { animation-delay: 1.6s; } .b5 { animation-delay: 1.8s; }

    .cursor { animation: blink 1s steps(1) infinite; }
    .scan   { animation: scan 5s linear infinite; }
    .pulse  { animation: pulse 2s ease-in-out infinite; }
    .glitch { animation: glitch 4s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .row, .bar { animation: none; opacity: 1; transform: none; }
      .scan, .glitch, .pulse, .cursor { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0f1f"/>
      <stop offset="1" stop-color="#ff2e4d"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e4d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff2e4d" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ff2e4d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="10" y="10" width="800" height="380" rx="6"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="10" y="10" width="800" height="380" rx="6" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect x="10" y="10" width="800" height="380" fill="url(#grid)"/>
    <rect class="scan" x="10" y="0" width="800" height="40" fill="url(#scanGrad)"/>
    <!-- big kanji watermark -->
    <text x="790" y="370" text-anchor="end" class="jp" font-size="150" font-weight="900" fill="#ffffff" fill-opacity=".03">開発者</text>
  </g>
  <rect x="10.5" y="10.5" width="799" height="379" rx="6" fill="none" stroke="#2a2a2e"/>

  <!-- corner brackets -->
  <g stroke="#ff2e4d" stroke-width="3" fill="none">
    <path d="M10 40V10H40"/>
    <path d="M780 10H810V40"/>
    <path d="M810 360V390H780"/>
    <path d="M40 390H10V360"/>
  </g>

  <!-- header -->
  <g class="row r1">
    <rect x="34" y="32" width="10" height="10" class="red pulse"/>
    <text x="54" y="42" class="mono red" font-size="13" font-weight="700" letter-spacing="3">[ SYSTEM ]</text>
    <text x="176" y="42" class="jp" font-size="13" fill="#8a8a8a" letter-spacing="2">ステータスウィンドウ</text>
    <text x="786" y="42" text-anchor="end" class="mono dim" font-size="12">ID: 108486488</text>
    <line x1="34" y1="56" x2="786" y2="56" stroke="#2a2a2e"/>
  </g>

  <!-- name -->
  <g class="row r2">
    <g class="glitch">
      <text x="34" y="100" class="mono" font-size="34" font-weight="800" fill="#ff2e4d" fill-opacity=".55" transform="translate(2 0)">SAYKACHI</text>
      <text x="34" y="100" class="mono" font-size="34" font-weight="800" fill="#f5f5f5">SAYKACHI</text>
    </g>
    <text x="232" y="98" class="jp" font-size="16" fill="#8a8a8a">— サイカチ</text>
  </g>

  <!-- left column: info -->
  <g class="mono">
    <g class="row r3">
      <text x="34" y="146" class="lbl">CLASS</text>
      <text x="130" y="146" class="val">Full-stack Developer</text>
    </g>
    <g class="row r4">
      <text x="34" y="178" class="lbl">TITLE</text>
      <text x="130" y="178" class="val">クロスプラットフォームの魔術師</text>
    </g>
    <g class="row r5">
      <text x="34" y="210" class="lbl">REALM</text>
      <text x="130" y="210" class="val">Web · Desktop · Server</text>
    </g>
    <g class="row r6">
      <text x="34" y="242" class="lbl">WEAPON</text>
      <text x="130" y="242" class="val"><tspan class="red">Rust</tspan> + <tspan class="red">TypeScript</tspan></text>
    </g>
    <g class="row r7">
      <text x="34" y="274" class="lbl">STATUS</text>
      <circle cx="137" cy="269" r="5" fill="#2ee86b" class="pulse"/>
      <text x="150" y="274" class="val">Open to collaboration</text>
    </g>
  </g>

  <!-- right column: stats -->
  <g class="mono">
    <text x="470" y="146" class="lbl row r3">PARAMETERS</text>

    <g class="row r3">
      <text x="470" y="178" class="lbl">FRONTEND</text>
      <rect x="580" y="168" width="170" height="10" rx="2" fill="#222226"/>
      <rect x="580" y="168" width="162" height="10" rx="2" fill="url(#barGrad)" class="bar b1"/>
      <text x="786" y="178" text-anchor="end" class="val" font-size="13">S</text>
    </g>
    <g class="row r4">
      <text x="470" y="206" class="lbl">BACKEND</text>
      <rect x="580" y="196" width="170" height="10" rx="2" fill="#222226"/>
      <rect x="580" y="196" width="150" height="10" rx="2" fill="url(#barGrad)" class="bar b2"/>
      <text x="786" y="206" text-anchor="end" class="val" font-size="13">A</text>
    </g>
    <g class="row r5">
      <text x="470" y="234" class="lbl">RUST</text>
      <rect x="580" y="224" width="170" height="10" rx="2" fill="#222226"/>
      <rect x="580" y="224" width="140" height="10" rx="2" fill="url(#barGrad)" class="bar b3"/>
      <text x="786" y="234" text-anchor="end" class="val" font-size="13">A</text>
    </g>
    <g class="row r6">
      <text x="470" y="262" class="lbl">UI / UX</text>
      <rect x="580" y="252" width="170" height="10" rx="2" fill="#222226"/>
      <rect x="580" y="252" width="155" height="10" rx="2" fill="url(#barGrad)" class="bar b4"/>
      <text x="786" y="262" text-anchor="end" class="val" font-size="13">S</text>
    </g>
    <g class="row r7">
      <text x="470" y="290" class="lbl">COFFEE</text>
      <rect x="580" y="280" width="170" height="10" rx="2" fill="#222226"/>
      <rect x="580" y="280" width="170" height="10" rx="2" fill="url(#barGrad)" class="bar b5"/>
      <text x="786" y="290" text-anchor="end" class="val red" font-size="13">∞</text>
    </g>
  </g>

  <!-- footer / prompt -->
  <g class="row r7">
    <line x1="34" y1="320" x2="786" y2="320" stroke="#2a2a2e"/>
    <text x="34" y="352" class="mono" font-size="14" fill="#8a8a8a"><tspan class="red">❯</tspan> 新しいクエストを受け入れますか？ <tspan fill="#f5f5f5">[ YES ]</tspan>  <tspan class="dim">[ NO ]</tspan> <tspan class="red cursor">▌</tspan></text>
  </g>
</svg>
